# Hermes agents behind a LiteLLM gateway.
#
# Secret boundary (threat model in README.md):
#   - provider and Rovo keys, database password: litellm and postgres only
#   - LiteLLM master key: litellm and the on-demand admin container only
#   - GitHub App private keys: github-token only; agents get short-lived tokens for granted levels
#   - each agent: only its own LiteLLM virtual key and Slack tokens
#   - workspaces, where agents run everything (including untrusted PR builds): no agent secrets
#
# Networks:
#   agents      - agents <-> litellm and github-token. Not internal: everything on it has egress.
#   litellm-db  - litellm <-> postgres only. Internal: no egress and agents are not attached.
#   admin       - admin <-> litellm only. Internal: the admin container can't reach agents,
#                 Postgres, or the internet.
#   workspaces  - agents <-> their workspaces (SSH), and workspaces <-> github-token. Internal.
#                 Workspaces can't reach LiteLLM or Postgres.
#   workspace-egress - workspaces' internet access, for dependencies and GitHub. Not internal.

name: hermes

# Images are pinned by tag and digest. See "Upgrading" in README.md before changing any of them.

# Caps each container's log at 30 MB (3 files of 10 MB).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hermes-agent: &hermes-agent
  # Before changing the Hermes version, run tests/run.sh and follow the side-task checklist in
  # hermes/config.yaml (new Hermes versions can add side tasks that would bypass `fast`).
  # hermes/image is Hermes plus SSH settings for the workspace. Keep the `image` tag in step with
  # HERMES_IMAGE so a new version gets a fresh build.
  build:
    context: ./hermes/image
    args:
      HERMES_IMAGE: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
  image: hermes-agent:v0.22.5-local
  restart: unless-stopped
  logging: *logging
  # Starts as root only to set up the agent's home, then drops to the Hermes user. no-new-privileges
  # blocks regaining root through setuid binaries.
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
  command: ["gateway", "run"]
  networks: [agents, workspaces]
  environment:
    HERMES_UID: ${HERMES_UID:-10000}
    HERMES_GID: ${HERMES_GID:-10000}
    # Hermes' file tools only write under this path; they run in the workspace, hence its /work.
    HERMES_WRITE_SAFE_ROOT: /work

# Each agent's workspace, where all its commands run (see workspace/supervisor.py). Its only secret
# is a LiteLLM key that can get GitHub tokens for the agent's granted levels.
x-workspace: &workspace
  build: ./workspace
  image: hermes-workspace:local
  restart: unless-stopped
  logging: *logging
  # An init process reaps the processes the supervisor kills.
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  # Root only for sshd (SYS_CHROOT is for its privilege separation) and to kill and clean up after
  # the workspace user.
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID, SYS_CHROOT]
  read_only: true
  # exec because Docker defaults tmpfs to noexec, and builds load native libraries from /tmp
  tmpfs: ["/tmp:size=2g,exec", "/run"]
  networks: [workspaces, workspace-egress]
  environment: &workspace-environment
    # Resets after this many minutes with no one logged in: kills the workspace user's processes and,
    # unless WORKSPACE_KEEP_FILES is "true", deletes /work.
    WORKSPACE_IDLE_MINUTES: "180"
    WORKSPACE_KEEP_FILES: "false"
    # The github_pr App's bot account, from ./.env; commits fail until both are set (see README.md).
    GIT_AUTHOR_NAME: ${GIT_BOT_NAME:-}
    GIT_AUTHOR_EMAIL: ${GIT_BOT_EMAIL:-}
    GIT_COMMITTER_NAME: ${GIT_BOT_NAME:-}
    GIT_COMMITTER_EMAIL: ${GIT_BOT_EMAIL:-}
  mem_limit: 4g
  cpus: 2
  pids_limit: 4096
  healthcheck:
    test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2222), timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [litellm-db]
    env_file: secrets/postgres.env
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
    # Mounted at the parent of the versioned PGDATA (18/docker) so pg_upgrade --link works later.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.106.4@sha256:db36453d25e76c9eb689d7d51b8e5fa48843243d7a86ed1284cf574ce0107b3f
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [agents, litellm-db, admin]
    env_file: [secrets/litellm.env, secrets/master.env]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/tier_classifier.py:/app/tier_classifier.py:ro
    # Host-only, for LiteLLM's own admin UI. Agents and the admin container reach litellm:4000 directly.
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Mints short-lived GitHub App tokens for the levels in github-token/levels.json that an agent's
  # LiteLLM key has been granted. The Apps' private keys stay here. secrets/github-app.env is
  # optional: a level without credentials answers 503.
  github-token:
    build: ./github-token
    image: hermes-github-token:local
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [agents, workspaces]
    env_file:
      - path: secrets/github-app.env
        required: false
    volumes:
      - ./github-token/levels.json:/app/levels.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Manages agents' keys, MCP and GitHub access, and Slack settings. Not started by `up`; use
  # bin/admin.
  admin:
    build: ./admin
    image: hermes-admin:local
    profiles: [admin]
    # Root to create agents' directories for the Hermes user and read their mode-600 .env files.
    # label=disable: on SELinux hosts, files an agent copies from its image keep the agent's label,
    # which would stop admin reading or purging them.
    security_opt: [no-new-privileges:true, label=disable]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs: [/tmp]
    networks: [admin]
    env_file: secrets/master.env
    environment:
      LITELLM_URL: http://litellm:4000
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - agents-data:/agents
      - workspace-config:/workspaces
      - ./github-token/levels.json:/templates/github-levels.json:ro
    depends_on:
      litellm:
        condition: service_healthy

  # Two services per agent:
  #   agent-<name>      its own agents-data subdirectory, SOUL.md (identity prompt), and the shared
  #                     hermes/config.yaml
  #   workspace-<name>  its own workspace-config subdirectory and the shared caches
  # SOUL.md, config.yaml, and .env are read-only so the agent can't rewrite its instructions, where
  # its requests go, or its key. admin writes .env through the whole volume; changes apply on agent
  # restart. Restarting a workspace restarts its agent, so it forgets directories the reset removed.
  # To add an agent: append `bin/admin compose <name>` output here, write hermes/souls/<name>.md,
  # then run `bin/admin create <name>` (required before the agent can start).
  agent-default:
    <<: *hermes-agent
    depends_on:
      litellm:
        condition: service_healthy
      workspace-default:
        condition: service_healthy
        restart: true
    volumes:
      - type: volume
        source: agents-data
        target: /opt/data
        volume:
          subpath: default
      - type: volume
        source: agents-data
        target: /opt/data/.env
        read_only: true
        volume:
          subpath: default/.env
      - ./hermes/souls/default.md:/opt/data/SOUL.md:ro
      - ./hermes/config.yaml:/opt/data/config.yaml:ro

  workspace-default:
    <<: *workspace
    environment:
      <<: *workspace-environment
      WORKSPACE_IDLE_MINUTES: "180"
      WORKSPACE_KEEP_FILES: "false"
    volumes:
      - type: volume
        source: workspace-config
        target: /config
        read_only: true
        volume:
          subpath: default
      - workspace-cache:/cache
      # Emptied whenever the workspace resets.
      - /work

networks:
  agents: {}
  litellm-db:
    internal: true
  admin:
    internal: true
  workspaces:
    internal: true
  workspace-egress: {}

volumes:
  postgres-data: {}
  # Maven, npm, Yarn, pnpm, and Corepack caches, shared by every workspace and kept across resets.
  workspace-cache: {}
  # Per agent: its workspace's SSH keys and LiteLLM key, written by admin. Each workspace mounts
  # only its own; agents mount none of it.
  workspace-config: {}
  # Per agent: its Hermes home, including .env. Only admin mounts the whole volume.
  agents-data: {}
