# Compose override for tests/run.sh: tests/fixtures secrets, the generated mock LiteLLM config,
# fake Jev, Atlassian, Anthropic, and GitHub endpoints, a git server standing in for GitHub for the
# workspace, and a fake OIDC provider (standing in for Keycloak) and model for the board page.
# TEST_WORK is run.sh's temporary directory and TEST_SLOT its slot (0-9), which keeps concurrent runs'
# bridge names and images apart. Images built from this repository get per-slot tags so a run never
# uses another run's build, or overwrites the running stack's.

services:
  postgres:
    env_file: !override [tests/fixtures/postgres.env]

  litellm:
    env_file: !override [tests/fixtures/litellm.env, tests/fixtures/master.env]
    ports: !override
      - "127.0.0.1:${TEST_LITELLM_PORT:-14000}:4000"
    volumes:
      - ${TEST_WORK:?run tests/run.sh}/litellm.yaml:/app/config.yaml:ro
      - ./tests:/tests:ro
    environment:
      TYPESAFE_API_BASE: http://fake-jev:8001
      ROUTER_CLASSIFIERS: ${TEST_ROUTER_CLASSIFIERS:-jev,llm}
      ROUTER_CLASSIFIER_MODEL: ${TEST_ROUTER_CLASSIFIER_MODEL:-classifier-mock}
      TYPESAFE_API_KEY: ${TEST_TYPESAFE_API_KEY-test-typesafe-key}
      ATLASSIAN_JIRA_WRITE_API_KEY: ${TEST_ATLASSIAN_JIRA_WRITE_API_KEY-test-atlassian-jira-write-key}
      ONYX_SEARCH_PAT: ${TEST_ONYX_SEARCH_PAT-test-onyx-search-pat}

  mcp-atlassian:
    env_file: !override [tests/fixtures/atlassian.env]

  admin:
    image: hermes-admin:test-${TEST_SLOT:?run tests/run.sh}
    env_file: !override [tests/fixtures/master.env, tests/fixtures/onyx-admin.env]
    volumes:
      - ./tests:/tests:ro
      - ${TEST_WORK}/github-levels.json:/templates/github-levels.json:ro

  onyx-api:
    env_file: !override [tests/fixtures/onyx.env, tests/fixtures/onyx-db.env]
  onyx-background:
    env_file: !override [tests/fixtures/onyx.env, tests/fixtures/onyx-db.env]
  # Runs tests/onyx_tool_checks.py; the tests don't start Onyx itself.
  onyx-mcp:
    env_file: !override [tests/fixtures/onyx.env, tests/fixtures/onyx-db.env]
    volumes:
      - ./tests:/tests:ro
  onyx-db:
    env_file: !override [tests/fixtures/onyx-db.env]

  github-token:
    image: hermes-github-token:test-${TEST_SLOT}
    env_file: !override [{path: "${TEST_WORK}/github-app.env"}]
    environment:
      GITHUB_API_URL: http://fake-github:8004
    volumes:
      - ${TEST_WORK}/github-levels.json:/app/levels.json:ro

  agent-default:
    image: hermes-agent:test-${TEST_SLOT}

  # Logs in through tests/fake_oidc.py, whose certificate authority it trusts, at an address the
  # check script (run in fake-oidc) can reach. The board page and fake-oidc are on boards-egress.
  board-default:
    image: hermes-agent:test-${TEST_SLOT}
    environment:
      HERMES_DASHBOARD_OIDC_ISSUER: https://fake-oidc:8443
      HERMES_DASHBOARD_PUBLIC_URL: http://board-default:9119
      SSL_CERT_FILE: /tls/ca.crt
    ports: !override
      - "127.0.0.1:${TEST_BOARD_PORT:-19119}:9119"
    volumes:
      - ${TEST_WORK}/tls/ca.crt:/tls/ca.crt:ro
      - ./tests:/tests:ro

  # A 15-second idle limit, so run.sh can watch a reset.
  workspace-default:
    image: hermes-workspace:test-${TEST_SLOT}
    environment:
      WORKSPACE_IDLE_MINUTES: "0.25"
      WORKSPACE_KEEP_FILES: ${TEST_WORKSPACE_KEEP_FILES:-false}
      WORKSPACE_POLL_SECONDS: "2"

  # Serves the test repository run.sh creates with git daemon, from the workspace image (which has
  # git). Like GitHub, it speaks git's smart protocol, which partial clones need.
  # safe.directory: the repository belongs to the host user, not the container's.
  fake-git:
    image: hermes-workspace:test-${TEST_SLOT}
    networks: [workspaces]
    volumes:
      - ${TEST_WORK}/git:/srv:ro
    entrypoint: ["git", "-c", "safe.directory=*", "daemon", "--export-all", "--base-path=/srv", "--port=8005", "--reuseaddr"]

  fake-jev:
    image: python:3.12-slim
    networks: [agents]
    volumes:
      - ./tests/fake_jev.py:/app/fake_jev.py:ro
    command: ["python", "-u", "/app/fake_jev.py"]

  # Behind LiteLLM in place of mcp-atlassian, on the same network.
  fake-atlassian:
    image: python:3.12-slim
    networks: [atlassian]
    volumes:
      - ./tests/fake_atlassian.py:/app/fake_atlassian.py:ro
    command: ["python", "-u", "/app/fake_atlassian.py"]

  # Behind LiteLLM in place of onyx-mcp, on the same network.
  fake-onyx:
    image: python:3.12-slim
    networks: [onyx]
    volumes:
      - ./tests/fake_onyx.py:/app/fake_onyx.py:ro
    command: ["python", "-u", "/app/fake_onyx.py"]

  fake-oidc:
    image: hermes-agent:test-${TEST_SLOT}
    networks: [boards-egress]
    volumes:
      - ./tests:/tests:ro
      - ${TEST_WORK}/tls:/tls:ro
    entrypoint: ["/opt/hermes/.venv/bin/python", "-u", "/tests/fake_oidc.py"]

  # The board chat checks' model, reached directly rather than through LiteLLM (tests/board_chat_checks.py).
  fake-openai:
    image: python:3.12-slim
    networks: [boards]
    volumes:
      - ./tests/fake_openai.py:/app/fake_openai.py:ro
    command: ["python", "-u", "/app/fake_openai.py"]

  fake-anthropic:
    image: python:3.12-slim
    networks: [agents]
    volumes:
      - ./tests/fake_anthropic.py:/app/fake_anthropic.py:ro
    command: ["python", "-u", "/app/fake_anthropic.py"]

  fake-github:
    image: python:3.12-slim
    networks: [agents]
    volumes:
      - ./tests/fake_github.py:/app/fake_github.py:ro
      - ${TEST_WORK}/github-app.pub.pem:/app/public.pem:ro
    command: ["python", "-u", "/app/fake_github.py"]

# Bridge names must be unique on the host (see compose.yaml), so each slot has its own, and none
# is the stack's. Linux limits them to 15 characters.
networks:
  agents:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-agents"}
  litellm-db:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-litellm-db"}
  admin:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-admin"}
  workspaces:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-workspaces"}
  workspace-egress:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-wsp-egress"}
  atlassian:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-atlassian"}
  onyx:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-onyx"}
  onyx-backend:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-onyx-be"}
  onyx-egress:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-onyx-egress"}
  onyx-ui:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-onyx-ui"}
  boards:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-boards"}
  # run.sh sets BOARDS_SUBNET and BOARDS_GATEWAY per slot, apart from the stack's.
  boards-egress:
    driver_opts: {com.docker.network.bridge.name: "ht${TEST_SLOT}-boards-eg"}
